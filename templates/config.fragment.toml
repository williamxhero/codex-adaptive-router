# Merge this fragment into ~/.codex/config.toml through scripts/install_user_layer.py.
# Project .codex/config.toml files may still override these defaults.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
